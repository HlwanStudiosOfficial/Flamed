name: Generate Particle Optimizations & Commit

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Generate Optimization Particle Files
      shell: python
      run: |
        import json
        import os

        # Subpack configurations
        # Maps subpack folder to the particles that should be disabled in it
        low_particles = [
            "minecraft:campfire_smoke_particle",
            "minecraft:lava_particle",
            "minecraft:lava_drip_particle",
            "minecraft:water_drip_particle",
            "minecraft:water_splash_particle",
            "minecraft:portal_directional_particle",
            "minecraft:rain_splash_particle",
            "minecraft:falling_dust_particle"
        ]

        subpack_config = {
            "subpacks/Low/particles": low_particles,
            # Add Medium, High, Extreme folders here as we vibe code them!
            # "subpacks/Medium/particles": medium_particles,
        }

        disable_template = {
            "format_version": "1.10.0",
            "particle_effect": {
                "description": {
                    "identifier": "",
                    "basic_render_parameters": {
                        "material": "particles_alpha",
                        "texture": "textures/particle/particles"
                    }
                },
                "components": {
                    "minecraft:emitter_lifetime_once": {
                        "active_time": 0.1
                    },
                    "minecraft:emitter_rate_instant": {
                        "num_particles": 0
                    },
                    "minecraft:particle_lifetime_expression": {
                        "max_lifetime": 0
                    }
                }
            }
        }

        for folder, particles in subpack_config.items():
            os.makedirs(folder, exist_ok=True)
            for particle_id in particles:
                filename = particle_id.replace("minecraft:", "") + ".json"
                file_path = os.path.join(folder, filename)

                data = disable_template.copy()
                data["particle_effect"]["description"]["identifier"] = particle_id

                with open(file_path, "w", encoding="utf-8") as f:
                    json.dump(data, f, indent=2)
                print(f"Generated: {file_path}")

    - name: Commit and Push changes back to main branch
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add subpacks/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate particle optimization files" && git push)
