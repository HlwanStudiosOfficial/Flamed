name: Generate Particle Optimizations & Commit

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Generate Subpack Particle Files
      shell: python
      run: |
        import json
        import os

        low_particles = [
            "minecraft:campfire_smoke_particle",
            "minecraft:lava_particle",
            "minecraft:lava_drip_particle",
            "minecraft:water_drip_particle",
            "minecraft:water_splash_particle",
            "minecraft:portal_directional_particle",
            "minecraft:rain_splash_particle",
            "minecraft:falling_dust_particle"
        ]

        medium_particles = low_particles + [
            "minecraft:basic_flame_particle",
            "minecraft:soul_fire_particle",
            "minecraft:bubble_column_bubble",
            "minecraft:squid_ink_particle"
        ]

        high_particles = medium_particles + [
            "minecraft:spore_blossom_ambient_particle",
            "minecraft:falling_spore_blossom_particle",
            "minecraft:end_rod",
            "minecraft:ash_particle",
            "minecraft:crimson_spore_particle",
            "minecraft:warped_spore_particle"
        ]

        extreme_particles = high_particles + [
            "minecraft:critical_hit_particle",
            "minecraft:enchanted_hit_particle",
            "minecraft:mob_spell_emitter",
            "minecraft:potion_splash_particle",
            "minecraft:enchanting_table_particle",
            "minecraft:explosion_particle",
            "minecraft:large_explosion_particle",
            "minecraft:block_destruct_particle"
        ]

        subpack_config = {
            "subpacks/Low/particles": low_particles,
            "subpacks/Medium/particles": medium_particles,
            "subpacks/High/particles": high_particles,
            "subpacks/Extreme/particles": extreme_particles,
        }

        disable_template = {
            "format_version": "1.10.0",
            "particle_effect": {
                "description": {
                    "identifier": "",
                    "basic_render_parameters": {
                        "material": "particles_alpha",
                        "texture": "textures/particle/particles"
                    }
                },
                "components": {
                    "minecraft:emitter_lifetime_once": {
                        "active_time": 0.1
                    },
                    "minecraft:emitter_rate_instant": {
                        "num_particles": 0
                    },
                    "minecraft:particle_lifetime_expression": {
                        "max_lifetime": 0
                    }
                }
            }
        }

        for folder, particles in subpack_config.items():
            os.makedirs(folder, exist_ok=True)
            for particle_id in particles:
                filename = particle_id.replace("minecraft:", "") + ".json"
                file_path = os.path.join(folder, filename)

                data = disable_template.copy()
                data["particle_effect"]["description"]["identifier"] = particle_id

                with open(file_path, "w", encoding="utf-8") as f:
                    json.dump(data, f, indent=2)
                print(f"Generated: {file_path}")

    - name: Commit and Push changes back to main branch
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add subpacks/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate all subpack particle optimizations (Low, Medium, High, Extreme)" && git push)
